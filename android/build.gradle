plugins {
    id 'com.android.library'
}

group 'com.icapps.flutter_key_value_file_storage'
version '1.0-SNAPSHOT'

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def kotlinExtensionType = org.jetbrains.kotlin.gradle.dsl.KotlinAndroidProjectExtension

if (agpMajor < 9 || project.extensions.findByType(kotlinExtensionType) == null) {
    apply plugin: 'kotlin-android'
}

android {
    namespace 'com.icapps.flutter_key_value_file_storage'
    compileSdk 36

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 24
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    lint {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

project.extensions.configure(kotlinExtensionType) { kotlinExtension ->
    kotlinExtension.compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}
